name: Draft Obsidian release

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Require the exact manifest version as the tag
        run: node scripts/release/release-metadata.mjs
      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ github.sha }}
          path: dist/
      - name: Check verified artifacts
        run: |
          cd "dist/$RELEASE_TAG"
          sha256sum --check SHA256SUMS.txt
      - name: Attest verified release files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.RELEASE_TAG }}/main.js
            dist/${{ env.RELEASE_TAG }}/manifest.json
            dist/${{ env.RELEASE_TAG }}/styles.css
            dist/${{ env.RELEASE_TAG }}/LICENSE
            dist/${{ env.RELEASE_TAG }}/THIRD_PARTY_NOTICES.md
            dist/${{ env.RELEASE_TAG }}/SHA256SUMS.txt
      - name: Verify attestations before creating the draft
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for file in main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md SHA256SUMS.txt; do
            gh attestation verify "dist/$RELEASE_TAG/$file" \
              --bundle "$ATTESTATION_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Create a draft with individual Obsidian assets
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "dist/$RELEASE_TAG/main.js" \
            "dist/$RELEASE_TAG/manifest.json" \
            "dist/$RELEASE_TAG/styles.css" \
            "dist/$RELEASE_TAG/LICENSE" \
            "dist/$RELEASE_TAG/THIRD_PARTY_NOTICES.md" \
            "dist/$RELEASE_TAG/SHA256SUMS.txt"
